<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Selam Bank</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <nav class="main-nav">
        <div class="container">
            <h1 class="logo">Selam Bank</h1>
            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/accounts}">Accounts</a>
                <a th:href="@{/transactions}">Transactions</a>
                <form th:action="@{/auth/logout}" method="post" style="display: inline;">
                    <button type="submit" class="button">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="auth-form">
            <h2>Profile Settings</h2>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <form th:action="@{/profile/update}" method="post" th:object="${customer}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" readonly>
                </div>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                </div>

                <button type="submit" class="button primary">Update Profile</button>
                <a th:href="@{/dashboard}" class="button">Cancel</a>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Selam Bank. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
